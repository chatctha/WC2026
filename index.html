<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        body { font-family: 'Kanit', sans-serif; }
        .score-input { @apply w-8 h-7 text-center bg-[#FEF9C3] border border-[#FDE047] rounded text-xs font-bold focus:outline-none focus:ring-1 focus:ring-yellow-500 transition-all; }
        .group-table th { @apply bg-[#1E293B] text-white p-1.5 text-[11px] font-bold uppercase tracking-wider text-center; }
        .group-table td { @apply p-1.5 border-b border-slate-100 text-xs text-center; }
        .match-card { @apply bg-white rounded-xl shadow-sm p-3 mb-2 border border-slate-100 hover:border-blue-200 transition-colors; }
        .sticky-header { @apply sticky top-0 bg-slate-50 z-10 py-2; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50">
    <div class="max-w-[1400px] mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center text-white text-3xl font-bold shadow-lg">26</div>
                <div>
                    <h1 class="text-3xl font-black text-slate-900 leading-tight">FIFA WORLD CUP 2026</h1>
                    <p class="text-slate-500 font-medium italic">Canada | Mexico | USA</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-white px-4 py-2 rounded-full shadow-sm border border-slate-200 text-sm font-semibold text-slate-600">
                    🇹🇭 Thailand Time (UTC+7)
                </div>
                <button onclick="clearAllData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-5 py-2 rounded-full text-sm font-bold border border-rose-200 transition-all">
                    ล้างข้อมูล
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- Column 1: Matches -->
            <div class="lg:col-span-4 xl:col-span-3 order-1">
                <h2 class="text-lg font-bold text-blue-800 mb-4 flex items-center gap-2">
                    รอบแบ่งกลุ่ม
                </h2>
                <div id="matches-container" class="lg:max-h-[85vh] lg:overflow-y-auto pr-2 custom-scrollbar">
                    <!-- Matches will be injected here -->
                </div>
            </div>

            <!-- Column 2: Standings -->
            <div class="lg:col-span-4 xl:col-span-4 order-2">
                <h2 class="text-lg font-bold text-emerald-800 mb-4">
                    ตารางคะแนน
                </h2>
                <div id="standings-container" class="space-y-6">
                    <!-- Standings will be injected here -->
                </div>

                <div class="mt-8">
                    <h2 class="text-lg font-bold text-orange-700 mb-4">
                        อันดับที่ 3 ที่ดีที่สุด
                    </h2>
                    <div id="best-third-container" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <!-- Best 3rd table injected here -->
                    </div>
                </div>
            </div>

            <!-- Column 3: Knockout -->
            <div class="lg:col-span-4 xl:col-span-5 order-3">
                <h2 class="text-lg font-bold text-rose-800 mb-4">
                    รอบน็อกเอาท์
                </h2>
                <div id="knockout-container" class="space-y-4">
                    <!-- Knockout rounds will be injected here -->
                </div>
            </div>

        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
