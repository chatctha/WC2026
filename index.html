<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทายผลฟุตบอลโลก 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .score-input { @apply w-10 h-8 text-center bg-yellow-100 border border-yellow-400 rounded focus:outline-none focus:ring-2 focus:ring-yellow-500 transition-all; }
        .group-table { @apply w-full text-xs sm:text-sm text-left border-collapse; }
        .group-table th, .group-table td { @apply border border-gray-200 p-1.5; }
        .group-table th { @apply bg-slate-800 text-white text-center font-normal; }
        .match-card { @apply bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-blue-300 transition-colors; }
        .section-title { @apply text-xl font-bold mb-4 flex items-center gap-2; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { @apply bg-gray-100; }
        ::-webkit-scrollbar-thumb { @apply bg-gray-300 rounded-full hover:bg-gray-400; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-[1600px] mx-auto p-4 sm:p-6">
        <header class="flex flex-col sm:flex-row items-center justify-between mb-8 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center text-white text-3xl font-bold shadow-lg">26</div>
                <div class="text-left">
                    <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">FIFA WORLD CUP 2026</h1>
                    <p class="text-slate-500 font-medium italic">Canada | Mexico | USA</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-white px-4 py-2 rounded-full shadow-sm border border-slate-200 text-sm font-semibold text-slate-600">
                    🇹🇭 Thailand Time (UTC+7)
                </div>
                <button onclick="resetScores()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-full text-sm font-bold border border-rose-200 transition-all">
                    ล้างข้อมูล
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Group Stage Matches -->
            <div class="lg:col-span-4 xl:col-span-3">
                <h2 class="section-title text-blue-700">
                    <span class="w-2 h-8 bg-blue-700 rounded-full"></span>
                    รอบแบ่งกลุ่ม
                </h2>
                <div id="matches-container" class="space-y-3 lg:max-h-[calc(100vh-200px)] lg:overflow-y-auto lg:pr-3">
                    <!-- Matches will be injected here -->
                </div>
            </div>

            <!-- Group Standings -->
            <div class="lg:col-span-4 xl:col-span-4">
                <h2 class="section-title text-emerald-700">
                    <span class="w-2 h-8 bg-emerald-700 rounded-full"></span>
                    ตารางคะแนน
                </h2>
                <div id="groups-container" class="grid grid-cols-1 gap-6">
                    <!-- Groups will be injected here -->
                </div>

                <div class="mt-10">
                    <h2 class="section-title text-orange-600">
                        <span class="w-2 h-8 bg-orange-600 rounded-full"></span>
                        อันดับที่ 3 ที่ดีที่สุด
                    </h2>
                    <div id="third-place-container" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <!-- Third place table will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Knockout Bracket -->
            <div class="lg:col-span-4 xl:col-span-5">
                <h2 class="section-title text-rose-700">
                    <span class="w-2 h-8 bg-rose-700 rounded-full"></span>
                    รอบน็อกเอาท์
                </h2>
                <div id="knockout-container" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2">
                    <!-- Knockout rounds will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
